<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bố cục CSS Grid - Hiệu ứng Hào Quang</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>

  <div class="grid-container">
    <div class="card">
      <h3>⚡ Neon Cyan</h3>
      <p>Hào quang xanh điện quang (Electric Cyan & Blue) mang phong cách công nghệ tương lai.</p>
    </div>
    <div class="card">
      <h3>✨ Cyber Violet</h3>
      <p>Hào quang tím hồng viễn tưởng (Violet & Neon Pink) mềm mại và nổi bật.</p>
    </div>
    <div class="card">
      <h3>🔥 Sunset Amber</h3>
      <p>Hào quang hoàng hôn ấm áp (Coral & Amber Flame) tạo điểm nhấn đầy năng lượng.</p>
    </div>
  </div>

</body>
</html>
