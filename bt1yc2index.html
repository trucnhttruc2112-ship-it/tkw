<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài 1 - Yêu cầu 2: CSS Grid 3 cột</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bt1yc2style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <h1>Bố cục CSS Grid 3 Cột</h1>
      <p>3 cột bằng nhau, khoảng cách 20px, mỗi cột là một thẻ nền xám nhạt và bo góc 10px</p>
    </header>

    <div class="grid-layout">
      <div class="grid-card">
        <h3>Cột 1</h3>
        <p>Thẻ thứ nhất trong bố cục lưới CSS Grid 3 cột bằng nhau.</p>
      </div>

      <div class="grid-card">
        <h3>Cột 2</h3>
        <p>Thẻ thứ hai trong bố cục lưới CSS Grid 3 cột bằng nhau.</p>
      </div>

      <div class="grid-card">
        <h3>Cột 3</h3>
        <p>Thẻ thứ ba trong bố cục lưới CSS Grid 3 cột bằng nhau.</p>
      </div>
    </div>
  </div>
</body>
</html>
